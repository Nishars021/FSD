<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form </title>
</head>
<body>
    <form>
        <label for="">Name </label>
        <br>
        <input type="text">
        <br>
        <span style="color:red">Kindly enter your name</span>
        <br>
        <label for="">SEN </label>
        <br>
        <input type="text" id="username">
        <br>
        <span style="color:red">Kindly enter your SEN number</span>
        <br>
        <label for="">Email</label>
        <br>
        <input type="email">
        <br>
        <span style="color:red">Kindly enter your email id</span>
        <br>
        <label for="">Enter Semester</label>
        <br>
        <input type="number">
        <br>
        <span style="color:red">Kindly select your semester</span>
        <br>
        <br>
        <input type="submit">
    </form>
</body>
</html>
